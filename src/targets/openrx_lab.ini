# OpenRX lab test firmware (NextPCB radio lab, procedure OPENRX-LAB).
#
# The EU receiver build plus the serial test console (lib/LAB). Each model is
# one flash image with two applications: the receiver (app0) and the same
# board as an ExpressLRS transmitter (app1, RX-as-TX) for "link tx". Built and
# packaged by the recipe in the Incutec compliance repository
# (lab-brief/firmware/), which also sets the declared conducted power:
#   PLATFORMIO_BUILD_FLAGS="-DOPENRX_LAB_TARGET_2G4_DBM=<n> -DOPENRX_LAB_TARGET_868_DBM=<n>"
# The chip settings themselves come from the hardware layout.

[openrx_lab]
build_flags =
	-DOPENRX_LAB=1
	-DRegulatory_Domain_EU_CE_2400

[env:Unified_ESP32C3_2400_RX_LAB_via_UART]
extends = env:Unified_ESP32C3_2400_RX_via_UART
build_flags =
	${env:Unified_ESP32C3_2400_RX_via_UART.build_flags}
	${openrx_lab.build_flags}

[env:Unified_ESP32C3_2400_TX_LAB_via_UART]
extends = env:Unified_ESP32C3_2400_TX_via_ETX
build_flags =
	${env:Unified_ESP32C3_2400_TX_via_ETX.build_flags}
	${openrx_lab.build_flags}

[env:Unified_ESP32C3_LR1121_RX_LAB_via_UART]
extends = env:Unified_ESP32C3_LR1121_RX_via_UART
build_flags =
	${env:Unified_ESP32C3_LR1121_RX_via_UART.build_flags}
	${openrx_lab.build_flags}

[env:Unified_ESP32C3_LR1121_TX_LAB_via_UART]
extends = env:Unified_ESP32C3_LR1121_TX_via_ETX
build_flags =
	${env:Unified_ESP32C3_LR1121_TX_via_ETX.build_flags}
	${openrx_lab.build_flags}
